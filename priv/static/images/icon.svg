<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" role="img" aria-label="Chidori">
  <!-- 画面のヘッダーに出しているマークと同じ。オレンジの角丸に、白い千鳥（チドリ）のシルエット。
       丸い頭・短いくちばし・ふっくらした胸、後ろへ細く伸びる畳んだ翼、細い脚。
       首の輪・翼の線・目は地の色で抜く（白一色のままチドリと分かる手掛かり）。
       文字ではなく図形で描いてある —— フォントに依らせると、環境ごとに形が変わる -->
  <rect width="256" height="256" rx="56" fill="#f97316"/>
  <g fill="#ffffff">
    <!-- 胴（胸は丸く、尾へ向かって細く伸びる） -->
    <path d="M70 128 C66 164 96 188 136 188 C170 188 196 170 212 150 L238 128
             C214 130 192 128 172 120 C148 110 118 104 96 108 C82 112 72 118 70 128 Z"/>
    <!-- 頭 -->
    <circle cx="94" cy="100" r="36"/>
    <!-- くちばし（短い） -->
    <path d="M62 96 L36 106 L62 112 Z"/>
    <!-- 脚（細く、少し長め） -->
    <rect x="124" y="182" width="8" height="44" rx="4"/>
    <rect x="144" y="182" width="8" height="40" rx="4"/>
  </g>
  <!-- 首の輪 -->
  <path d="M74 126 C88 140 112 142 128 128" fill="none" stroke="#f97316" stroke-width="7" stroke-linecap="round"/>
  <!-- 畳んだ翼の線（背中から尾の先へ） -->
  <path d="M120 140 C150 152 186 146 222 134" fill="none" stroke="#f97316" stroke-width="6" stroke-linecap="round"/>
  <!-- 目 -->
  <circle cx="86" cy="94" r="7" fill="#f97316"/>
</svg>
