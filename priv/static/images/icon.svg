<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" role="img" aria-label="Chidori">
  <!-- 画面のヘッダーに出しているマークと同じ。オレンジの角丸に、白い小鳥のシルエット
       （スズメと鶏のあいだくらいの丸い体に、背中から大きく持ち上げた羽）。羽の縁と目は
       地の色で抜く。文字ではなく図形で描いてある —— フォントに依らせると、環境ごとに形が変わる -->
  <rect width="256" height="256" rx="56" fill="#f97316"/>
  <g fill="#ffffff">
    <!-- 尾（少し上へ跳ね上げる） -->
    <path d="M66 160 C46 150 32 130 30 108 C48 120 62 132 80 140 Z"/>
    <!-- 体と頭 -->
    <ellipse cx="124" cy="156" rx="70" ry="54"/>
    <circle cx="172" cy="108" r="36"/>
    <path d="M140 120 L178 134 L152 166 Z"/>
    <!-- とさか（小さめ） -->
    <circle cx="164" cy="72" r="8"/>
    <circle cx="177" cy="70" r="8"/>
    <!-- くちばし -->
    <path d="M204 100 L228 110 L204 120 Z"/>
    <!-- 足 -->
    <rect x="106" y="200" width="10" height="30" rx="5"/>
    <rect x="136" y="200" width="10" height="30" rx="5"/>
  </g>
  <!-- 大きな羽。背中から上へ持ち上げ、下の縁を羽先のように波打たせる。
       縁を地の色で抜いて、白どうしでも体と分かれて見えるようにする -->
  <path d="M154 134 C146 98 116 64 62 50 C56 70 62 84 72 94 C60 98 56 112 62 124
           C72 122 82 124 90 130 C86 142 90 152 100 158 C122 158 142 150 154 134 Z"
        fill="#ffffff" stroke="#f97316" stroke-width="8" stroke-linejoin="round"/>
  <!-- 目（地の色で抜く） -->
  <circle cx="185" cy="104" r="7" fill="#f97316"/>
</svg>
