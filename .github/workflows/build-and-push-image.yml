# Docker イメージをビルドして GHCR（ghcr.io/<owner>/chidori）へ公開する。
#
# デプロイ先は `docker compose pull` でこのイメージを取得して動かす
# （docker-compose.yml / docker-compose.standalone.example.yml）。
# 実行環境は amd64 のみ —— 非公開リポジトリなので Actions の実行時間と GHCR の
# ストレージがプランの無料枠を消費する。複数アーキのビルドは枠の消費が増えるので作らない。
name: build-and-push-image

on:
  push:
    branches: [main]
    tags: ["v*"]
    # ドキュメントだけの変更ではイメージの中身が変わらない（README.md・docs/ は
    # .dockerignore でイメージから除外している）ので、実行時間を使わない
    paths-ignore:
      - "**.md"
      - "docs/**"
      - ".gitignore"
      - "docker-compose*.yml"
      - ".env.example"
  # 手動実行（Actions タブの "Run workflow"）。ドキュメントだけ変えたあとに作り直したいときなど
  workflow_dispatch:

# 同じ ref への連続した push では古い実行を打ち切る（無料枠の節約）
concurrency:
  group: build-and-push-image-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write # GHCR への push に必要

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: リポジトリをチェックアウト
        uses: actions/checkout@v7

      - name: Buildx をセットアップ
        uses: docker/setup-buildx-action@v4

      - name: GHCR にログイン
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # タグ:
      #   latest        … main への push 時（デプロイ先が通常追いかけるタグ）
      #   sha-<短縮SHA> … 毎回付ける固定タグ（どのコミットが動いているか後から特定できる）
      #   v1.2.3        … `v*` タグを push した場合のみ
      - name: イメージのタグ・ラベルを決める
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=short,prefix=sha-
            type=ref,event=tag

      - name: イメージをビルドして push
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          push: true
          # 単一アーキなので attestation（provenance/sbom）は付けない。付けると GHCR の
          # パッケージにマニフェストリストが増えて見通しが悪くなる
          provenance: false
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # 依存の取得とコンパイルのレイヤーを実行間で使い回す
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # 古いイメージを消して最新の 2 つだけ残す。
      #
      # `latest` を付け替えても前の版は `sha-` タグ付きで残り続けるため、放っておくと
      # push のたびに積み上がり、非公開パッケージのストレージ枠を食う。
      # 1 世代前は、新しい版で起動できなかったときに戻す先として残す。
      #
      # 失敗しても握りつぶさない（continue-on-error を付けない）。消せていないのに
      # 成功に見えると、枠が埋まって push が止まる日まで気づけないため。
      # GITHUB_TOKEN で権限が足りない場合は、delete:packages + read:packages を持つ PAT を
      # シークレット GHCR_CLEANUP_TOKEN に入れれば、そちらが使われる。
      - name: 古いイメージを削除して直近 2 版だけ残す
        uses: actions/delete-package-versions@v5
        with:
          package-name: ${{ github.event.repository.name }}
          package-type: container
          min-versions-to-keep: 2
          token: ${{ secrets.GHCR_CLEANUP_TOKEN || secrets.GITHUB_TOKEN }}
