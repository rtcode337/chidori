# Docker イメージをビルドして GHCR（ghcr.io/<owner>/chidori）へ公開する。
#
# デプロイ先は `docker compose pull` でこのイメージを取得して動かす
# （docker-compose.yml / docker-compose.standalone.example.yml）。
# 実行環境は amd64 のみ（複数アーキのビルドは作らない。要るようになったら platforms に足す）。
#
# テスト（ci.yml）の結果は待たずに並んで走る。main へ直に push する運用なので、
# 待たせても落ちた変更は main に入っている —— 落ちたら直して push し直すか、
# 前の sha- タグへ戻す。
name: build-and-push-image

on:
  push:
    branches: [main]
    tags: ["v*"]
    # ドキュメントだけの変更ではイメージの中身が変わらない（README.md・docs/ は
    # .dockerignore でイメージから除外している）ので、実行時間を使わない
    paths-ignore:
      - "**.md"
      - "docs/**"
      - ".gitignore"
      - "docker-compose*.yml"
      - ".env.example"
  # 手動実行（Actions タブの "Run workflow"）。ドキュメントだけ変えたあとに作り直したいときなど
  workflow_dispatch:

# 同じ ref への連続した push では古い実行を打ち切る（途中の版のイメージは使わないため）
concurrency:
  group: build-and-push-image-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write # GHCR への push に必要

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: リポジトリをチェックアウト
        uses: actions/checkout@v7

      - name: Buildx をセットアップ
        uses: docker/setup-buildx-action@v4

      - name: GHCR にログイン
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # タグ:
      #   latest        … main への push 時（デプロイ先が通常追いかけるタグ）
      #   sha-<短縮SHA> … 毎回付ける固定タグ（どのコミットが動いているか後から特定できる）
      #   v1.2.3        … `v*` タグを push した場合のみ
      - name: イメージのタグ・ラベルを決める
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=short,prefix=sha-
            type=ref,event=tag

      - name: イメージをビルドして push
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          push: true
          # 単一アーキなので attestation（provenance/sbom）は付けない。付けると GHCR の
          # パッケージにマニフェストリストが増えて見通しが悪くなる
          provenance: false
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # 依存の取得とコンパイルのレイヤーを実行間で使い回す
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # 古いイメージを消して、タグ付きの直近 20 版と `v*` のタグを残す。
      #
      # 公開パッケージなので GHCR の容量・転送は無料枠を消費しないが、`latest` を
      # 付け替えても前の版は `sha-` タグ付きで残るため、放っておくと際限なく積み上がる。
      # 20 版は、新しい版で起動できなかったときに戻す先を選べるだけの幅。
      # リリースのタグ（v1.2.3）は数に関わらず消さない。
      #
      # actions/delete-package-versions はタグでは除外できない（コンテナの版の名前は
      # ダイジェストで、タグを見ない）ので、タグで選べるこちらを使う。
      # push を途中で打ち切った実行が残すタグ無しの版も一緒に消す。
      #
      # 失敗しても握りつぶさない（continue-on-error を付けない）。消せていないのに
      # 成功に見えると、積み上がっていることに気づけないため。
      # GITHUB_TOKEN で権限が足りない場合は、delete:packages + read:packages を持つ PAT を
      # シークレット GHCR_CLEANUP_TOKEN に入れれば、そちらが使われる。
      - name: 古いイメージを削除して直近 20 版と v* のタグだけ残す
        uses: dataaxiom/ghcr-cleanup-action@v1
        with:
          package: ${{ github.event.repository.name }}
          keep-n-tagged: 20
          exclude-tags: "v*"
          delete-untagged: true
          token: ${{ secrets.GHCR_CLEANUP_TOKEN || secrets.GITHUB_TOKEN }}
